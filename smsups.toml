[ENTITIES]
name        = "smsups"
author      = "Nitori"
repo        = "unraid-smsups"
tag         = "v1.0.0"
launch      = "Settings/SMSUps"
icon        = "fa-battery-full"
min         = "6.12.0"
forgejo     = "http://192.168.1.108:3030"
pluginURL   = "&forgejo;/&author;/&repo;/releases/download/&tag;/&name;.plg"
packageURL  = "&forgejo;/&author;/&repo;/releases/download/&tag;/&name;.txz"

# version omitted → auto-generated by upg.py

# RC scripts installed directly — Mode attribute sets file permissions
[[FILE]]
Attr = { Name = "/etc/rc.d/rc.ups-metrics", Mode = "0755" }
SCRIPT_RAW = "./smsups-plugin/rc.ups-metrics"

[[FILE]]
Attr = { Name = "/etc/rc.d/rc.smsups-bridge", Mode = "0755" }
SCRIPT_RAW = "./smsups-plugin/rc.smsups-bridge"

# Unraid plugin page and AJAX backend
[[FILE]]
Attr = { Name = "/usr/local/emhttp/plugins/&name;/&name;.page" }
SCRIPT_RAW = "./smsups-plugin/smsups.page"

[[FILE]]
Attr = { Name = "/usr/local/emhttp/plugins/&name;/php/exec.php" }
SCRIPT_RAW = "./smsups-plugin/exec.php"

# Default config files — copied to /boot on first install
[[FILE]]
Attr = { Name = "/usr/local/emhttp/plugins/&name;/default_config.yaml" }
SCRIPT_RAW = "./smsups-plugin/default_config.yaml"

[[FILE]]
Attr = { Name = "/usr/local/emhttp/plugins/&name;/default_bridge.yaml" }
SCRIPT_RAW = "./smsups-plugin/default_bridge.yaml"

# Binaries package (ups-metrics + smsups-nut-bridge)
[[FILE]]
Attr = { Name = "&name;.txz", Run = "upgradepkg --install-new --reinstall" }
URL  = "&packageURL;"
MD5  = "&MD5;"

# Install: copy default configs to /boot if absent, create smsups.cfg, start services
[[FILE]]
Attr = { Run = "/bin/bash", Method = "install" }
SCRIPT_RAW = "./smsups-plugin/install.sh"

# Remove: stop services, delete binaries and emhttp files (preserve /boot config)
[[FILE]]
Attr = { Run = "/bin/bash", Method = "remove" }
SCRIPT_RAW = "./smsups-plugin/remove.sh"

[ENTITIES]
name        = "smsups"
author      = "bobbintb"
repo        = "unraid-smsups"
tag         = "v1.0.0"
launch      = "Settings/SMSUps"
icon        = "fa-battery-full"
min         = "6.12.0"
pluginURL   = "https://github.com/&author;/&repo;/releases/download/&tag;/&name;.plg"
packageURL  = "https://github.com/&author;/&repo;/releases/download/&tag;/&name;.txz"
# MD5 placeholder — replace with actual hash after running build-package.sh on Linux
MD5         = "00000000000000000000000000000000"

# version omitted → auto-generated by upg.py

[[FILE]]
Attr = { Name = "&name;.txz", Run = "upgradepkg --install-new --reinstall" }
URL  = "&packageURL;"
MD5  = "&MD5;"

# Install script: copies default configs, creates smsups.cfg, starts both services
[[FILE]]
Attr = { Run = "/bin/bash", Method = "install" }
SCRIPT_RAW = "./smsups-plugin/install.sh"

# Remove script: stops services, removes binaries and emhttp files (keeps config)
[[FILE]]
Attr = { Run = "/bin/bash", Method = "remove" }
SCRIPT_RAW = "./smsups-plugin/remove.sh"

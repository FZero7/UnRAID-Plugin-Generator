[ENTITIES]
# Uppercase plugin name so SMS-UPS.plg installs before nut-dw.plg at boot
# (plugin-manager processes .plg files in ASCII order; uppercase < lowercase)
name        = "SMS-UPS"
# Internal paths and config dir keep the original lowercase name
slug        = "smsups"
author      = "FZero7"
repo        = "unraid-smsups"
tag         = "1.0.9"
launch      = "Settings/SMSUps"
icon        = "fa-battery-full"
min         = "6.12.0"
github      = "https://github.com"
pluginURL   = "&github;/&author;/&repo;/releases/download/&tag;/&name;.plg"
packageURL  = "&github;/&author;/&repo;/releases/download/&tag;/&slug;.txz"

# version omitted → auto-generated by upg.py

# RC scripts installed directly — Mode attribute sets file permissions
[[FILE]]
Attr = { Name = "/etc/rc.d/rc.ups-metrics", Mode = "0755" }
SCRIPT_RAW = "./smsups-plugin/rc.ups-metrics"

[[FILE]]
Attr = { Name = "/etc/rc.d/rc.smsups-bridge", Mode = "0755" }
SCRIPT_RAW = "./smsups-plugin/rc.smsups-bridge"

# Unraid plugin page and AJAX backend
[[FILE]]
Attr = { Name = "/usr/local/emhttp/plugins/&slug;/&slug;.page" }
SCRIPT_RAW = "./smsups-plugin/smsups.page"

[[FILE]]
Attr = { Name = "/usr/local/emhttp/plugins/&slug;/php/exec.php" }
SCRIPT_RAW = "./smsups-plugin/exec.php"

# Default config files — copied to /boot on first install
[[FILE]]
Attr = { Name = "/usr/local/emhttp/plugins/&slug;/default_config.yaml" }
SCRIPT_RAW = "./smsups-plugin/default_config.yaml"

[[FILE]]
Attr = { Name = "/usr/local/emhttp/plugins/&slug;/default_bridge.yaml" }
SCRIPT_RAW = "./smsups-plugin/default_bridge.yaml"

# Log rotation for /var/log/ups-metrics.log and /var/log/smsups-bridge.log
[[FILE]]
Attr = { Name = "/etc/logrotate.d/&slug;" }
SCRIPT_RAW = "./smsups-plugin/logrotate.conf"

# Binaries package cached on /boot — extracted by install.sh and rc scripts on boot
[[FILE]]
Attr = { Name = "/boot/config/plugins/&slug;/&slug;.txz" }
URL  = "&packageURL;"
MD5  = "&MD5;"

# Install: copy default configs to /boot if absent, create smsups.cfg, start services
[[FILE]]
Attr = { Run = "/bin/bash", Method = "install" }
SCRIPT_RAW = "./smsups-plugin/install.sh"

# Remove: stop services, delete binaries and emhttp files (preserve /boot config)
[[FILE]]
Attr = { Run = "/bin/bash", Method = "remove" }
SCRIPT_RAW = "./smsups-plugin/remove.sh"

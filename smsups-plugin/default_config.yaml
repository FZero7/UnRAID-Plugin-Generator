device:
    address: ""              # IP ou hostname do UPS (OBRIGATÓRIO)
    interval: 10s
    log: warn
    login:
        username: admin
        password: ""         # Senha do UPS (OBRIGATÓRIO)
    http:
        client:
            dial_timeout: 5s

logs:
    # Campo obrigatório — ups-metrics não inicia sem ele.
    # Os erros de conexão vão para /var/log/ups-metrics.log, não para o syslog.
    type: "victorialogs"
    victorialogs:
        address: localhost
        port: 9428
        timeout: 30s

metrics:
    influxdb:
        enabled: false
        address: influx
        database: UPS
        port: 8086
    prometheus:
        enabled: true
        path: /metrics
        port: 9110
